  rise(t, t0 + .2, 0, () => txt(String(i + 1).padStart(2, '0') + ' / 04', nx, ny - z * 1.1, 20 * S, 500, C.field, al, 'mono', 5));
  rise(t, t0 + .3, 0, () => { if (PORTRAIT) { txt(p.light, nx, ny, z * .7, 300, C.field, al); txt(p.bold, nx, ny + z * .95, z, 800, C.blue, al); } else { txt(p.light, nx, ny, z * .7, 300, C.field, al); txt(p.bold, nx, ny + z * .95, z, 800, C.blue, al); } });
  rise(t, t0 + .45, 0, () => txt(p.role, nx, ny + z * 1.75, 20 * S, 500, C.deep, al, 'mono', 5));
  x.restore();
  hud(t, false);
}
function section(t) {
  const t0 = T.section, t1 = T.end;
  // the ground in section behind: strata top to bottom
  x = bx;
  const gy = H * .16;
  x.fillStyle = C.surface; x.fillRect(0, 0, W, gy);
  for (let i = 0; i < 24; i++) { const y0 = gy + i * (H - gy) / 24; x.fillStyle = tint(i * 6350 / 24); x.fillRect(0, y0, W, (H - gy) / 24 + 1); }
  x.fillStyle = C.green; x.fillRect(0, gy - 6 * S, W, 8 * S);
  const kin = eo(lin(t, t0, t0 + .6)); x.fillStyle = C.surface; x.globalAlpha = 1 - kin; x.fillRect(0, 0, W, H); x.globalAlpha = 1;
  // the cut sweeps through the separator, front half away
  put({ id: 'sehds1800', yaw: -.35 + (t - t0) * .08, camYaw: 0, pitch: 10, cut: .8 - .8 * eio(lin(t, t0 + .3, t0 + 1.8)), solid: 1, xray: 0, reveal: 10, ground: false },
    PORTRAIT ? CX : CX - .14 * W, PORTRAIT ? CY + .02 * H : CY + .1 * H, (PORTRAIT ? .82 : .72) * Math.min(W, H));
  x = fx;
  const z = (PORTRAIT ? 70 : 62) * S;
  if (PORTRAIT) { rise(t, t0 + .5, 0, () => { txt('DRAWN', CX, H * .095 + 10 * S, z * .62, 300, C.field, 'center'); }); rise(t, t0 + .7, 0, () => txt('IN SECTION', CX, H * .095 + z * .85, z * .8, 800, C.blue, 'center')); }
  else { rise(t, t0 + .5, 0, () => txt('DRAWN', W * .62, CY - 80 * S, z * .8, 300, C.paper)); rise(t, t0 + .7, 0, () => txt('IN SECTION', W * .62, CY - 80 * S + z * 1.05, z, 800, C.paper)); }
  // the three meanings
  const rows = [[C.green, 'GREEN', 'THE GROUND'], [C.blue, 'BLUE', 'SURFACE WATER'], [C.red, 'RED', 'FOUL WATER']];
  rows.forEach(([c, n, mng], j) => {
    const lx = PORTRAIT ? 100 * S + j * 300 * S : W * .62, ly = PORTRAIT ? H * .9 : CY + 60 * S + j * 54 * S;
    rise(t, t0 + .9 + j * .2, 0, () => { x.fillStyle = c; x.fillRect(lx, ly - 22 * S, 26 * S, 26 * S); txt(mng, lx + 40 * S, ly, (PORTRAIT ? 19 : 22) * S, 500, C.paper, 'left', 'mono', 3); });
  });
  gauge(t, 1800 + (t - t0) * 300, C.paper, .5);
  hud(t, true);
}
function end(t) {
  x = bx; x.fillStyle = C.deep; x.fillRect(0, 0, W, H);
  x = fx;
  // a slow tide of sky lines
  x.save(); x.strokeStyle = C.sky; x.lineWidth = 2 * S; for (let i = 0; i < 8; i++) { const y = H - ((t - T.end) * 40 * S + i * H / 8) % H; x.globalAlpha = .06; x.beginPath(); for (let u = 0; u <= W; u += 40 * S) x.lineTo(u, y + Math.sin(u / (220 * S) + t + i) * 9 * S); x.stroke(); } x.restore();
  const vb = D.hz.vb, w = PORTRAIT ? W * .82 : W * .5, s = w / vb[2], h = vb[3] * s, X = CX - w / 2, Y = CY - h / 2 - 30 * S;
  const drop = [5, 6, 7, 8, 9], dOrder = drop.slice().sort((a, b) => (P.hzBox[b].y + P.hzBox[b].h / 2) - (P.hzBox[a].y + P.hzBox[a].h / 2));
  const letters = P.hz.map((p, i) => i).filter(i => !drop.includes(i)).sort((a, b) => P.hzBox[a].x - P.hzBox[b].x);
  x.save(); x.translate(X, Y); x.scale(s, s); x.translate(-vb[0], -vb[1]);
  letters.forEach((i, o) => { const k = lin(t, T.end + 1.2 + o * .05, T.end + 1.7 + o * .05); if (k <= 0) return; x.save(); x.globalAlpha = eo(k); x.translate(0, (1 - eo(k)) * 30); x.fillStyle = P.hz[i].f; x.fill(P.hz[i].path); x.restore(); });
  x.restore();
  // the drop settles bottom band first, large and centred, then glides into the lockup
  let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9; drop.forEach(i => { const b = P.hzBox[i]; bx0 = Math.min(bx0, b.x); by0 = Math.min(by0, b.y); bx1 = Math.max(bx1, b.x + b.w); by1 = Math.max(by1, b.y + b.h); });
  const dcx = (bx0 + bx1) / 2, dcy = (by0 + by1) / 2, dh = by1 - by0, mm = eio(lin(t, T.end + .9, T.end + 1.8));
  const sc0 = 360 * S / dh, sx1 = X + (dcx - vb[0]) * s, sy1 = Y + (dcy - vb[1]) * s;
  const dsx = CX + (sx1 - CX) * mm, dsy = (CY - 30 * S) + (sy1 - CY + 30 * S) * mm, dsc = sc0 + (s - sc0) * mm;
  x.save(); x.translate(dsx, dsy); x.scale(dsc, dsc); x.translate(-dcx, -dcy);
  drop.forEach(i => { const o = dOrder.indexOf(i), k = lin(t, T.end + .1 + o * .14, T.end + .6 + o * .14); if (k <= 0) return; const e = eback(k); x.save(); x.globalAlpha = clamp(k * 2); x.translate(0, -(1 - e) * 60 * S / dsc); x.fillStyle = P.hz[i].f; x.fill(P.hz[i].path); x.restore(); });
  x.restore();
  const k2 = eo(lin(t, T.end + 2.0, T.end + 2.6));
  if (k2 > 0) {
    const z = (PORTRAIT ? 46 : 40) * S, a = 'BESPOKE, ', b = 'STANDARDISED', wa = measure(a, z, 800), wb = measure(b, z, 800, 'm', 0, true), ax = CX - (wa + wb) / 2, ay = Y + h + 110 * S + (1 - k2) * 16 * S;
    x.globalAlpha = k2; txt(a, ax, ay, z, 800, C.paper); txt(b, ax + wa, ay, z, 800, C.sky, 'left', 'm', 0, true);
    x.fillStyle = C.green; x.fillRect(CX - 50 * S * k2, ay + 30 * S, 100 * S * k2, 4 * S); x.globalAlpha = 1;
  }
  const k3 = lin(t, T.end + 2.5, T.end + 3.0); if (k3 > 0) { x.globalAlpha = k3; txt('SUDSENVIRO.COM', CX, PORTRAIT ? H - 240 * S : H - 100 * S, 24 * S, 500, C.sky, 'center', 'mono', 8); x.globalAlpha = 1; }
}

// ---------- frame
function scenes(t) { if (t < T.range) intro(t); else if (t < T.section) range(t); else if (t < T.end) section(t); else end(t); }
const XF = .5; // crossfade between scenes, seconds
function render(t) {
  bx.setTransform(1, 0, 0, 1, 0, 0); fx.setTransform(1, 0, 0, 1, 0, 0); fx.clearRect(0, 0, W, H);
  CURT = t; scenes(t);
  // dissolve over each cut: a plate of the next scene's ground colour rises and clears
  x = fx;
  const cuts = [[T.range, C.surface], [T.section, C.invert]];
  // end card covers the 3D with the deep ground fading up over the last half second of the section
  const ke = lin(t, T.end - .45, T.end); if (t < T.end && ke > 0) { x.fillStyle = C.deep; x.globalAlpha = es(ke); x.fillRect(0, 0, W, H); x.globalAlpha = 1; }
  cuts.forEach(([tc, col]) => { const a = 1 - Math.abs(t - tc) / (XF / 2); if (a > 0) { x.fillStyle = col; x.globalAlpha = es(a); x.fillRect(0, 0, W, H); x.globalAlpha = 1; } });
  const g = grain[Math.floor(t * 24) % 4]; for (let gy = 0; gy < H; gy += 256) for (let gx = 0; gx < W; gx += 256) x.drawImage(g, gx, gy);
  const fa = Math.max(1 - lin(t, 0, .8), lin(t, DUR - .6, DUR));
  if (fa > 0) { x.fillStyle = '#000'; x.globalAlpha = fa; x.fillRect(0, 0, W, H); x.globalAlpha = 1; }
}
window.render = render;
</script></body></html>
